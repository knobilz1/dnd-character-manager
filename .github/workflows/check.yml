# Fast correctness gate on every push and PR.
#
# release.yml only ever ran on a pushed tag, and it only proved the app
# COMPILES on three platforms — no typecheck, no tests, nothing about the data.
# That is why the release checklist in AGENTS.md §3 is manual, and why a
# silently-typo'd sourceBook or a duplicated id could ship. This job is the
# cheap half of that checklist, run automatically.
#
# Deliberately NOT here: `tauri build` (that's release.yml's job, ~9 min × 3
# platforms) and the tools/audit sweeps (they need the rulebook PDFs, which
# aren't in the repo).
name: check

on:
  push:
    branches: ['**']
    tags-ignore: ['v*'] # a tag push is a release; release.yml owns that
  pull_request:

# A newer push supersedes the one before it — no value in finishing a check for a
# commit that is already history.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      # The ONLY typecheck that works here: the root tsconfig is `files: []`
      # plus project references, so a bare `tsc --noEmit` checks nothing.
      - run: npx tsc -b --force
      - run: npm test

  rust:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      # tauri-build resolves tauri.conf.json's bundle resource globs inside the
      # build script, so an unmatched glob fails the compile before a single
      # test runs. The merged *_Anims.glb files it wants are gitignored —
      # `npm run prebuild` generates them from the committed per-clip GLBs, and
      # release.yml gets them for free because tauri-action runs the Node build
      # first. `cargo test --lib` never bundles anything, so it only needs the
      # glob to MATCH; empty placeholders do that in a second, where a real
      # prebuild would spend minutes merging and meshopt-compressing assets no
      # unit test looks at.
      - name: Placeholder animation bundles so the resource glob resolves
        shell: bash
        run: |
          for f in Human_Male Human_Female Elf_Male Elf_Female \
                   Dwarf_Male Dwarf_Female Half_Orc_Male Half_Orc_Female; do
            : > "public/models/${f}_Anims.glb"
          done
      # oauth.rs reads these through env!(), so the crate does not compile
      # without them. Tests never make a real Google call, so dummies are
      # correct here — the real values are release-only secrets.
      - name: cargo test
        working-directory: src-tauri
        env:
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
        run: cargo test --lib
