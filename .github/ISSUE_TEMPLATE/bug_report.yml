name: Bug report
description: Something is broken, or a rule is implemented wrong
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: What kind of problem is this?
      options:
        - Rules or data inaccuracy (a feature, spell, item or race is wrong)
        - Character sheet or creator
        - Combat, resources or rests
        - DM Console (AI Dungeon Master)
        - 3D character viewer
        - Google Drive sync
        - Import / export / printing
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.25.11"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where are you running it?
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Browser (npm run dev)
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a level 5 Monk
        2. Open the Combat tab
        3. ...
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source book and page
      description: Only for rules or data inaccuracies — which book says otherwise, and where?
      placeholder: "PHB p. 79, or TCE p. 62"

  - type: textarea
    id: character
    attributes:
      label: Character JSON (optional)
      description: If it only happens on one character, export it and paste or attach it here. Delete anything personal first.
      render: json
